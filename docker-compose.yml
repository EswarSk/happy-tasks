name: happy-task-management

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskapp}
      POSTGRES_USER: ${POSTGRES_USER:-taskapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/migrate.Dockerfile
    image: happy-task-management-migrate:local
    command:
      - -dir=/migrations
      - postgres
      - postgres://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD:-taskapp}@db:5432/${POSTGRES_DB:-taskapp}?sslmode=disable
      - up
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD:-taskapp}@db:5432/${POSTGRES_DB:-taskapp}?sslmode=disable
      HTTP_ADDR: :8080
      PORT: "8080"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEFAULT_ACTOR_ID: ${DEFAULT_ACTOR_ID:-00000000-0000-7000-8000-000000000001}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ATTACHMENTS_DIR: /data/attachments
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - attachments_data:/data/attachments
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    init: true
    stop_grace_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: ../../deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
    environment:
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:3000/
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true
    stop_grace_period: 20s

  load:
    image: grafana/k6:0.57.0
    profiles: [tools]
    environment:
      BASE_URL: http://api:8080
      PROJECT_ID: ${LOAD_PROJECT_ID:-02000000-0000-7000-8000-000000000001}
      ACTOR_ID: ${DEFAULT_ACTOR_ID:-00000000-0000-7000-8000-000000000001}
    volumes:
      - ./scripts/load:/scripts:ro
    command: run /scripts/tasks.js
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: happy-task-management-postgres-data
  attachments_data:
    name: happy-task-management-attachments-data
